# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection

packaging-test:
  stage: test
  image: python:3.12
  script:
    - pip install pytest
    - pytest tests/packaging/ -v

go-leakcheck:
  # goroutine leak verification via go.uber.org/goleak.VerifyTestMain.
  # Every internal/* package registers a TestMain that fails the package
  # if any non-allowlisted goroutine survives test completion.
  stage: test
  image: golang:1.25
  script:
    - cd agent && go test -count=1 ./...

go-race:
  stage: test
  image: golang:1.25
  script:
    - cd agent && go test -race -count=1 ./...

go-memcheck:
  # Heap-growth regression test. Runs the outbox hot path (Append/Ack) for
  # many iterations and asserts runtime.MemStats.HeapInuse delta stays
  # under a 2 MiB cap. Catches buffer/cursor accumulation a goroutine
  # leak check would miss.
  stage: test
  image: golang:1.25
  script:
    - cd agent && go test -count=1 -run TestHeapStable ./internal/outbox/...

agent-tpm:
  stage: test
  image: golang:1.25
  before_script:
    - apt-get update && apt-get install -y swtpm
  script:
    - cd agent && go test ./internal/keystore/... -v -run TPM

py-test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -e '.[dev]'
  script:
    - ruff check .
    - mypy server/app/
    - pytest server/tests/ --cov=server/app --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -q
  coverage: '/(?i)total.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

py-memcheck:
  # tracemalloc snapshots across repeated audit-chain operations, plus
  # pytest-memray allocation tracking on the full server suite to catch
  # native-allocator (malloc) leaks tracemalloc cannot see.
  stage: test
  image: python:3.12
  before_script:
    - pip install -e '.[dev]'
  script:
    - pytest server/tests/test_memory_leaks.py server/tests/test_tracemalloc_smoke.py -v
    - pytest server/tests/ --memray --most-allocations=10 -q --ignore=server/tests/observability/

py-migrations:
  stage: test
  image: python:3.12
  before_script:
    - pip install -e '.[dev]'
  script:
    - alembic upgrade head
    - alembic downgrade base
    - alembic upgrade head

py-bootstrap-admin:
  stage: test
  image: python:3.12
  before_script:
    - pip install -e '.[dev]'
  script:
    - export FLEET_BOOTSTRAP_ADMIN_EMAIL=ci-admin@example.test
    - rm -f /tmp/ci-admin.db
    - export FLEET_DB_URL=sqlite+aiosqlite:////tmp/ci-admin.db
    - alembic upgrade head
    - python -m server.tests._helpers.check_admin_seed --db-url "sqlite:////tmp/ci-admin.db" --email "$FLEET_BOOTSTRAP_ADMIN_EMAIL"

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

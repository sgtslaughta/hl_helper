syntax = "proto3";
package fleet.v1;

option go_package = "github.com/hlhelper/hl-agent/proto/fleet/v1";

import "google/protobuf/timestamp.proto";

import "fleet/v1/envelope.proto";
import "fleet/v1/results.proto";
import "fleet/v1/inventory.proto";
import "fleet/v1/exposure.proto";

message Disk {
  string device = 1;
  string mount = 2;
  string fstype = 3;
  uint64 size_bytes = 4;
}

message Nic {
  string name = 1;
  string mac = 2;
  repeated string ipv4 = 3;
  repeated string ipv6 = 4;
  uint64 speed_mbps = 5;
}

message HostSurvey {
  string host_id = 1;
  string os = 2;
  string os_version = 3;
  string kernel = 4;
  string arch = 5;
  string virt = 6;
  string cpu_model = 7;
  uint32 cpu_cores = 8;
  uint32 cpu_threads = 9;
  uint64 mem_total_bytes = 10;
  repeated Disk disks = 11;
  repeated Nic nics = 12;
  string bios_vendor = 13;
  string bios_version = 14;
  string board_vendor = 15;
  string board_product = 16;
  google.protobuf.Timestamp collected_at = 17;
  bytes signature = 200;
}

message HeartbeatConfig {
  uint32 interval_s = 1;
}

message RunSurvey {
  string reason = 1;
}

message RunInventory {
  string reason = 1;
  bool include_lang = 2;       // opt-in language pkg scan (pip/npm/cargo)
  repeated string lang_roots = 3;  // optional override roots; empty => agent defaults
}

message RunCertRotate {
  string reason = 1;  // "operator-initiated"|"policy-initiated"
}

message NetInterface {
  string name = 1;
  uint64 rx_bps = 2;
  uint64 tx_bps = 3;
  uint64 rx_errors = 4;
  uint64 tx_errors = 5;
  bool up = 6;
  uint64 mtu = 7;
  string mac = 8;
  repeated string ipv4 = 9;
  repeated string ipv6 = 10;
  bool since_boot = 11;
}

message RunExposureScan {
  string reason = 1;
}

message HostMetrics {
  float load_1 = 1;
  float load_5 = 2;
  float load_15 = 3;
  float mem_used_pct = 4;
  float disk_used_pct = 5;
  uint64 uptime_seconds = 6;
  uint64 net_rx_bps = 7;  // bytes/sec received, averaged over heartbeat interval
  uint64 net_tx_bps = 8;  // bytes/sec transmitted, averaged over heartbeat interval
  repeated NetInterface interfaces = 9;
}

message Heartbeat {
  enum AgentUpdateStatus {
    AGENT_UPDATE_STATUS_UNSPECIFIED = 0;
    AGENT_UPDATE_STATUS_IDLE = 1;
    AGENT_UPDATE_STATUS_DOWNLOADING = 2;
    AGENT_UPDATE_STATUS_SWAPPING = 3;
    AGENT_UPDATE_STATUS_HEALTHCHECKING = 4;
    AGENT_UPDATE_STATUS_ROLLED_BACK = 5;
    AGENT_UPDATE_STATUS_FAILED = 6;
  }

  string host_id = 1;
  google.protobuf.Timestamp at = 2;
  uint64 last_acked_seq = 3;
  HostMetrics metrics = 4;
  string agent_version = 5;
  AgentUpdateStatus update_status = 6;
  string update_target_version = 7;
  bool sleeping = 8;
  google.protobuf.Timestamp sleep_until = 9;
  bytes signature = 200;
}

message HeartbeatAck {
  google.protobuf.Timestamp server_at = 1;
  uint64 next_expected_seq = 2;
}

message ResumeRequest {
  string host_id = 1;
  string stream_session_id = 2;
  uint64 last_seq = 3;
}

message CapabilityRequest {
  string host_id = 1;
  string scope = 2;
}

message CertRotateRequest {
  string host_id = 1;
  bytes csr_pem = 2;
  bytes signing_pubkey = 3;  // 32-byte Ed25519 public key for identity match
  string prev_serial = 4;    // hex serial of currently-active cert (replay guard)
}

message CertIssueResponse {
  bytes cert_chain_pem = 1;
  google.protobuf.Timestamp not_after = 2;
}

message ManifestUpdate {
  bytes manifest_signed = 1;
}

message Decommission {
  string reason = 1;
  string requested_by = 2;
}

message DecommissionAck {
  google.protobuf.Timestamp at = 1;
}

message AgentAuditEvent {
  google.protobuf.Timestamp timestamp = 1;
  string task_id = 2;
  string binary = 3;
  repeated string args = 4;
  string elevator = 5;   // "sudo"|"doas"|"direct"|"none"
  string reason = 6;
  string phase = 7;      // "started"|"completed"|"denied"
  int32 exit_code = 8;
  string error = 9;
}

message AgentToServer {
  oneof msg {
    Heartbeat heartbeat = 1;
    ResultEnvelope result = 2;
    ResumeRequest resume = 3;
    CapabilityRequest cap_req = 4;
    CertRotateRequest cert_rotate = 5;
    DecommissionAck decom_ack = 6;
    HostSurvey host_survey = 7;
    AgentAuditEvent audit = 8;
    PackageInventory package_inventory = 9;
    ContainerInventory container_inventory = 10;
    HostFacts host_facts = 11;
    RuntimeExposure runtime_exposure = 12;
  }
}

message ServerToAgent {
  oneof msg {
    CommandEnvelope command = 1;
    HeartbeatAck hb_ack = 2;
    CertIssueResponse cert_issue = 3;
    ManifestUpdate manifest = 4;
    Decommission decom = 5;
    HeartbeatConfig hb_config = 6;
    RunSurvey run_survey = 7;
    RunInventory run_inventory = 8;
    RunCertRotate run_cert_rotate = 9;
    RunExposureScan run_exposure_scan = 10;
  }
}

service AgentBridge {
  rpc Stream(stream AgentToServer) returns (stream ServerToAgent);
}

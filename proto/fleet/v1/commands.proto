syntax = "proto3";
package fleet.v1;

option go_package = "github.com/hlhelper/hl-agent/proto/fleet/v1";

message PkgUpdate {
  repeated string classes = 1;
  bool dry_run = 2;
}

message Reboot {
  uint32 delay_seconds = 1;
  string reason = 2;
}

message ShellExec {
  string command = 1;
  repeated string args = 2;
  uint32 timeout_seconds = 3;
  bool as_root = 4;
  string reason = 5;
}

message TerminalOpen {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message FileTransfer {
  enum Dir {
    UPLOAD = 0;
    DOWNLOAD = 1;
  }
  Dir dir = 1;
  string remote_path = 2;
  uint64 size_bytes = 3;
}

message DockerOp {
  string op = 1;
  string container = 2;
}

message GetFacts {
  repeated string keys = 1;
}

message PluginInvoke {
  string plugin_id = 1;
  bytes payload = 2;
}

message AgentUpdateCmd {
  string release_id = 1;
  bytes manifest_json = 2;
  bytes manifest_sig = 3;
  string binary_url = 4;
  string download_token = 5;
  string expected_sha256 = 6;
  uint64 expected_size = 7;
  bool force = 8;
}

message AgentUpdateResult {
  string from_version = 1;
  string to_version = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCESS = 1;
    SIG_INVALID = 2;
    SHA_MISMATCH = 3;
    DOWNLOAD_FAILED = 4;
    SWAP_FAILED = 5;
    HEALTH_CHECK_FAILED = 6;
    ROLLED_BACK = 7;
  }
  Status status = 3;
  string error = 4;
}

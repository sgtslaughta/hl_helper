syntax = "proto3";
package fleet.v1;

option go_package = "github.com/hlhelper/hl-agent/proto/fleet/v1";

import "google/protobuf/timestamp.proto";

message RuntimeExposure {
  string host_id = 1;
  google.protobuf.Timestamp scanned_at = 2;
  repeated Process processes = 3;
  repeated ListeningSocket listeners = 4;
  repeated Connection connections = 5;
  repeated Service services = 6;
  repeated KernelModule kernel_modules = 7;
  repeated ContainerExposure container_exposure = 8;
  bool truncated = 9;
  bytes signature = 200;
}

message Process {
  uint32 pid = 1;
  string exe_path = 2;
  string user = 3;
  string cmdline = 4;
  repeated string loaded_libs = 5;
  string pkg = 6;
  string pkg_version = 7;
}

message ListeningSocket {
  string proto = 1;
  string bind_addr = 2;
  uint32 port = 3;
  uint32 pid = 4;
}

message Connection {
  string proto = 1;
  string local_addr = 2;
  uint32 local_port = 3;
  string remote_addr = 4;
  uint32 remote_port = 5;
  uint32 pid = 6;
  string state = 7;
}

message Service {
  string name = 1;
  string init_system = 2;
  string exec_path = 3;
  bool enabled = 4;
  bool active = 5;
  string pkg = 6;
  string pkg_version = 7;
}

message KernelModule {
  string name = 1;
  string version = 2;
  string pkg = 3;
}

message ContainerExposure {
  string container_id = 1;
  repeated Process processes = 2;
  repeated ListeningSocket listeners = 3;
  bool partial = 4;
}

[project]
site_name = "HL Helper"
site_description = "Self-hosted, security-focused fleet manager for Linux/Unix homelabs"
repo_url = "https://github.com/hlhelper/hl_helper"
docs_dir = "docs"

[project.theme]
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions."pymdownx.details"]

[[project.markdown_extensions."pymdownx.superfences".custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
[project.markdown_extensions.toc]
permalink = true

[project.theme.extra_css]
files = ["shared/_admonitions.css"]

[project.extra.version]
provider = "mike"

[[project.nav]]
name = "Home"
path = "index.md"


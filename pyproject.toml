[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl_helper"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "cryptography>=44",
  "grpcio>=1.68",
  "grpcio-tools>=1.68",
  "structlog>=24.4",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "biscuit-python>=0.4",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27", "pytest-cov>=5", "types-PyYAML>=6.0", "pytest-memray>=1.7"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["server/app/grpc/_pb"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["server/app/migrations/"]

[[tool.mypy.overrides]]
module = "server.app.grpc._pb.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "biscuit_auth"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc_status.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["server", "agent"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl_helper"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.0",
  "cryptography>=44",
  "grpcio>=1.68",
  "grpcio-tools>=1.68",
  "structlog>=24.4",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "biscuit-python>=0.4",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "apscheduler>=3.10",
  "cachetools>=5",
  "argon2-cffi>=23",
  "pyotp>=2.9",
  "webauthn>=2.0",
  "hvac>=2.0",
  "httpx>=0.27",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-instrumentation-grpc>=0.46b0",
  "prometheus-client>=0.20",
  "psutil>=7.2.2",
  "python-multipart>=0.0.27",
  "PyJWT>=2.8",
  "ijson>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27", "pytest-cov>=5", "types-PyYAML>=6.0", "pytest-memray>=1.7", "freezegun>=1.5"]
docs = ["sphinx>=7.0", "sphinx-markdown-builder>=0.6", "pyyaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["server/app/grpc/_pb"]

[tool.ruff.lint.per-file-ignores]
# pytest fixture re-imports look like redefinitions to ruff but are required.
"server/tests/**/*.py" = ["F811"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["server/app/migrations/"]

[[tool.mypy.overrides]]
module = "server.app.grpc._pb.*"
ignore_errors = true

# Pre-existing untyped tech debt — to be cleaned up in a follow-up.
[[tool.mypy.overrides]]
module = [
    "server.app.api.v1.agent_releases",
    "server.app.api.v1.enrollment_tokens",
    "server.app.api.v1.install",
    "server.app.api.v1.settings",
    "server.app.api.v1.tasks",
    "server.app.grpc.agent_bridge",
    "server.app.grpc.command_bridge",
    "server.app.lifespan",
    "server.app.models.host",
    "server.app.plugins.manifest",
    "server.app.settings.config",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "biscuit_auth"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc_status.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hvac", "hvac.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["server", "agent"]

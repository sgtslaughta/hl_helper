name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: mypy server/app/
      - name: pytest with coverage
        run: pytest server/tests/ --cov=server/app --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Alembic upgrade head + downgrade base + upgrade head (chain integrity)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
  py-bootstrap-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Bootstrap admin seed check
        env:
          FLEET_BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.test
          FLEET_DB_URL: sqlite+aiosqlite:////tmp/ci-admin.db
        run: |
          rm -f /tmp/ci-admin.db
          alembic upgrade head
          python -m server.tests._helpers.check_admin_seed --db-url "sqlite:////tmp/ci-admin.db" --email "$FLEET_BOOTSTRAP_ADMIN_EMAIL"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r server/app/ -ll
  py-memcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: pytest memory leak tests
        run: pytest server/tests/test_memory_leaks.py server/tests/test_tracemalloc_smoke.py -v
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: cd agent && go vet ./...
      - run: cd agent && go test ./...
  go-leakcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go test with goleak
        working-directory: agent
        run: go test -count=1 ./...
  go-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go test -race
        working-directory: agent
        run: go test -race -count=1 ./...
  go-memcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Heap-growth regression test
        working-directory: agent
        run: go test -count=1 -run TestHeapStable ./internal/outbox/...
  agent-tpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install swtpm
        run: sudo apt-get update && sudo apt-get install -y swtpm
      - name: go test TPM
        working-directory: agent
        run: go test ./internal/keystore/... -v -run TPM
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto
  packaging-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: pytest tests/packaging/ -v

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install CycloneDX generators
        run: |
          pip install cyclonedx-bom
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
      - name: Generate Python SBOM
        run: |
          pip install -e .
          cyclonedx-py environment --output-format json --output-file sbom-python.json
      - name: Generate Go agent SBOM
        working-directory: agent
        run: $(go env GOPATH)/bin/cyclonedx-gomod mod -licenses -json -output ../sbom-agent.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-python.json
            sbom-agent.json
          retention-days: 90
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd webui && npm ci
      - run: cd webui && npm run lint
      - run: cd webui && npm run typecheck
      - run: cd webui && npm run test:unit

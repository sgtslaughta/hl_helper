services:
  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/hl_helper.db
    volumes:
      - server_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/v1/observability/health', timeout=5).status_code==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  server_data:

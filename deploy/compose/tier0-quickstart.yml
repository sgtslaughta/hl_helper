services:
  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: hl_helper-server:${TAG:-dev}
    expose:
      - "8000"
    environment:
      # Pydantic settings read FLEET_* (env_prefix in server/app/settings/config.py).
      FLEET_DATA_DIR: /app/data
      FLEET_DB_URL: sqlite+aiosqlite:////app/data/fleet.db
      # Required: server refuses to serve admin/health endpoints without this.
      # Override with `ADMIN_TOKEN=... docker compose up`.
      FLEET_ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme-dev-token-set-in-prod}
      # Dev: allow Set-Cookie over HTTP. Set true when fronted by HTTPS.
      FLEET_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - server_data:/app/data
    restart: unless-stopped
    healthcheck:
      # /openapi.json is auth-free; /v1/observability/health requires admin bearer.
      test:
        - CMD
        - python
        - -c
        - "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/openapi.json', timeout=5).status_code==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  webui:
    build:
      context: ../..
      dockerfile: deploy/webui/Dockerfile
    image: hl_helper-webui:${TAG:-dev}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Server-to-server proxy target (loopback inside compose network).
      INTERNAL_API_BASE: http://server:8000
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  server_data:
